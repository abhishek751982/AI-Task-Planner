[project]
name = "guide-todoo"
version = "0.1.0"
description = "AI task assistant: PDF/chat → Apple Reminders, Jira, daily plan, reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "openai>=1.55.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
]

[project.scripts]
guide-todoo = "guide_todoo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guide_todoo"]
